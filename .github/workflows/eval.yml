name: Eval

# Asks Ask Copper the golden-set questions, has an AI judge mark each answer,
# and saves the scores in Langfuse (npm run eval). Fails when too few answers
# pass, so the pull request can't merge. The unit tests, lint, typecheck and
# build run in ci.yml.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
# GOOGLE_GENERATIVE_AI_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY and
# LANGFUSE_BASE_URL. Pull requests from forks don't get secrets, so the eval
# can't run for them.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run still in progress.
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Golden-set evaluation
        run: npm run eval
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          # Traces from CI are kept apart from traces from your own laptop.
          LANGFUSE_TRACING_ENVIRONMENT: ci
          EVAL_MIN_PASS_RATE: "0.75"
